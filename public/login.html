<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Âme</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/login.js" defer></script>
</head>
<body>

  <header class="navbar">
    <h1 class="logo">Âme</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
      </ul>
    </nav>
  </header>

  <main class="login-section">
    <!-- Contenedor de tabs login/registro -->
    <div class="auth-tabs">
      <button type="button" class="auth-tab-button active" data-tab="login">Iniciar sesión</button>
      <button type="button" class="auth-tab-button" data-tab="register">Registrarse</button>
    </div>

    <!-- PESTAÑA DE LOGIN -->
    <div id="login-tab" class="auth-tab-content active">
      <h2>Bienvenido de nuevo</h2>
      <p>Elige tu perfil para acceder a la plataforma.</p>

      <div class="role-tabs" role="tablist">
        <button type="button" class="role-button" data-role="cliente">Cliente</button>
        <button type="button" class="role-button" data-role="administrativo">Administrativo</button>
        <button type="button" class="role-button" data-role="psicologos">Psicólogos</button>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <input type="hidden" id="selectedRole" name="role" value="cliente">

        <label for="username">Correo electrónico</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="ejemplo@correo.com"
          autocomplete="username"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >

        <p id="roleInfo" class="inline-note"></p>
        <div id="demoCredentials" class="demo-box"></div>

        <div id="loginMessage" class="alert hidden"></div>

        <button type="submit" class="btn">Ingresar</button>
      </form>
    </div>

    <!-- PESTAÑA DE REGISTRO -->
    <div id="register-tab" class="auth-tab-content">
      <h2>Crear nueva cuenta</h2>
      <p>Completa el formulario para registrarte en Âme.</p>

      <div class="role-tabs" role="tablist">
        <button type="button" class="role-button register-role" data-role="cliente">Cliente</button>
        <button type="button" class="role-button register-role" data-role="psicologos">Psicólogo</button>
      </div>

      <form id="registerForm" class="login-form" novalidate>
        <input type="hidden" id="registerRole" name="role" value="cliente">

        <label for="registerName">Nombre completo</label>
        <input
          type="text"
          id="registerName"
          name="name"
          placeholder="Tu nombre"
          required
        >

        <label for="registerEmail">Correo electrónico</label>
        <input
          type="email"
          id="registerEmail"
          name="email"
          placeholder="ejemplo@correo.com"
          required
        >

        <label for="registerPassword">Contraseña</label>
        <input
          type="password"
          id="registerPassword"
          name="password"
          placeholder="••••••••"
          required
        >

        <label for="registerConfirmPassword">Confirmar contraseña</label>
        <input
          type="password"
          id="registerConfirmPassword"
          name="confirmPassword"
          placeholder="••••••••"
          required
        >

        <div id="psychologistFields" class="psychologist-fields hidden">
          <div class="field-group">
            <label for="registerCertificate">Número de certificado profesional</label>
            <input
              type="text"
              id="registerCertificate"
              name="certificate"
              placeholder="Ej. CNPS-123456"
            >
          </div>

          <div class="field-group">
            <label for="registerSpecialty">Especialidad</label>
            <input
              type="text"
              id="registerSpecialty"
              name="specialty"
              placeholder="Ej. Psicología clínica"
            >
          </div>

          <div class="field-group">
            <label for="registerExperience">Años de experiencia</label>
            <input
              type="number"
              id="registerExperience"
              name="experience"
              placeholder="Ej. 5"
              min="0"
            >
          </div>

          <div class="field-group">
            <label for="registerInstitution">Institución de formación</label>
            <input
              type="text"
              id="registerInstitution"
              name="institution"
              placeholder="Ej. Universidad Nacional"
            >
          </div>

          <div class="field-group">
            <label for="registerDocs">Documentos de respaldo</label>
            <textarea
              id="registerDocs"
              name="docs"
              placeholder="Describe los certificados o ingresa un enlace a tus documentos"
              rows="3"
            ></textarea>
          </div>
        </div>

        <p id="registerRoleInfo" class="inline-note"></p>

        <div id="registerMessage" class="alert hidden"></div>

        <button type="submit" class="btn">Registrarse</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Âme — Plataforma de bienestar emocional</p>
  </footer>

</body>
</html>
